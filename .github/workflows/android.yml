name: AUREL Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurel-verify-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Flutter app and Firebase functions
    runs-on: ubuntu-latest
    env:
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
      AUDIUS_API_KEY: ${{ secrets.AUDIUS_API_KEY }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_API_APPROVED: ${{ secrets.LASTFM_API_APPROVED }}
      AUREL_FIREBASE_API_KEY: ${{ secrets.AUREL_FIREBASE_API_KEY }}
      AUREL_FIREBASE_APP_ID: ${{ secrets.AUREL_FIREBASE_APP_ID }}
      AUREL_FIREBASE_PROJECT_ID: ${{ secrets.AUREL_FIREBASE_PROJECT_ID }}
      AUREL_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.AUREL_FIREBASE_MESSAGING_SENDER_ID }}
      AUREL_GOOGLE_SERVER_CLIENT_ID: ${{ secrets.AUREL_GOOGLE_SERVER_CLIENT_ID }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node for Firebase Functions
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate Firebase token broker
        run: |
          npm install --prefix functions --no-audit --no-fund
          npm --prefix functions run build

      - name: Report cloud account configuration
        env:
          AUREL_FIREBASE_API_KEY: ${{ secrets.AUREL_FIREBASE_API_KEY }}
          AUREL_FIREBASE_APP_ID: ${{ secrets.AUREL_FIREBASE_APP_ID }}
          AUREL_FIREBASE_PROJECT_ID: ${{ secrets.AUREL_FIREBASE_PROJECT_ID }}
          AUREL_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.AUREL_FIREBASE_MESSAGING_SENDER_ID }}
          AUREL_GOOGLE_SERVER_CLIENT_ID: ${{ secrets.AUREL_GOOGLE_SERVER_CLIENT_ID }}
        shell: bash
        run: |
          missing=()
          for key in \
            AUREL_FIREBASE_API_KEY \
            AUREL_FIREBASE_APP_ID \
            AUREL_FIREBASE_PROJECT_ID \
            AUREL_FIREBASE_MESSAGING_SENDER_ID \
            AUREL_GOOGLE_SERVER_CLIENT_ID; do
            if [[ -z "${!key}" ]]; then
              missing+=("$key")
            fi
          done
          {
            echo "## AUREL cloud accounts"
            if (( ${#missing[@]} == 0 )); then
              echo "Firebase and Google client configuration is present."
            else
              echo "Cloud account sign-in is not fully configured in this build."
              echo
              echo "Missing repository Actions secrets:"
              for key in "${missing[@]}"; do echo "- $key"; done
              echo
              echo "No secret values are printed by this check."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if (( ${#missing[@]} > 0 )); then
            for key in "${missing[@]}"; do
              echo "::warning title=Missing cloud account setting::$key is not configured"
            done
          fi

      - name: Report music catalogue configuration
        shell: bash
        run: |
          if [[ -n "$JAMENDO_CLIENT_ID" ]]; then
            echo "Jamendo application ID is configured."
          else
            echo "::warning title=Jamendo is not configured::Add JAMENDO_CLIENT_ID to repository Actions secrets."
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Generate Android project and apply AUREL platform files
        run: bash tool/bootstrap_android.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Restore stable CI debug signing key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: aurel-ci-debug-keystore-v1

      - name: Report Android signing fingerprints for Firebase OAuth
        working-directory: android
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          debug_keystore="$HOME/.android/debug.keystore"

          mkdir -p "$(dirname "$debug_keystore")"
          if [[ ! -f "$debug_keystore" ]]; then
            keytool -genkeypair -v \
              -keystore "$debug_keystore" \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          certificate_report="$(keytool -list -v \
            -keystore "$debug_keystore" \
            -storepass android \
            -alias AndroidDebugKey)"
          printf '%s\\n' "$certificate_report"

          debug_sha1="$(printf '%s\\n' "$certificate_report" | awk '
            /^[[:space:]]*SHA1:/ {
              sub(/^[[:space:]]*SHA1:[[:space:]]*/, "")
              print
              exit
            }
          ')"

          if [[ -z "$debug_sha1" ]]; then
            echo "Could not find the Android debug SHA-1 in Gradle signingReport output." >&2
            exit 1
          fi

          {
            echo "## Firebase Android debug signing fingerprint"
            echo
            echo "**SHA-1:** `$debug_sha1`"
            echo
            echo "Add this fingerprint under Firebase Project settings → Your apps → AUREL Android → SHA certificate fingerprints."
            echo
            echo "This is the temporary GitHub Actions debug certificate. A separately signed release build will have its own fingerprint."
            if [[ -n "${AUREL_GOOGLE_SERVER_CLIENT_ID:-}" ]]; then
              echo "**Google OAuth Web client ID:** configured"
            else
              echo "**Google OAuth Web client ID:** missing"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=Firebase Android debug SHA-1::$debug_sha1"

      - name: Save stable CI debug signing key
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: aurel-ci-debug-keystore-v1

      - name: Generate AUREL launcher icons
        run: dart run flutter_launcher_icons

      - name: Format Dart sources
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Compile Android debug bundle (not published)
        run: >-
          timeout 10m flutter build appbundle --debug --verbose
          --dart-define=JAMENDO_CLIENT_ID="$JAMENDO_CLIENT_ID"
          --dart-define=AUDIUS_API_KEY="$AUDIUS_API_KEY"
          --dart-define=LASTFM_API_KEY="$LASTFM_API_KEY"
          --dart-define=LASTFM_API_APPROVED="$LASTFM_API_APPROVED"
          --dart-define=AUREL_FIREBASE_API_KEY="$AUREL_FIREBASE_API_KEY"
          --dart-define=AUREL_FIREBASE_APP_ID="$AUREL_FIREBASE_APP_ID"
          --dart-define=AUREL_FIREBASE_PROJECT_ID="$AUREL_FIREBASE_PROJECT_ID"
          --dart-define=AUREL_FIREBASE_MESSAGING_SENDER_ID="$AUREL_FIREBASE_MESSAGING_SENDER_ID"
          --dart-define=AUREL_GOOGLE_SERVER_CLIENT_ID="$AUREL_GOOGLE_SERVER_CLIENT_ID"

      - name: Compile installable Android debug APK
        run: >-
          timeout 10m flutter build apk --debug
          --dart-define=JAMENDO_CLIENT_ID="$JAMENDO_CLIENT_ID"
          --dart-define=AUDIUS_API_KEY="$AUDIUS_API_KEY"
          --dart-define=AUREL_FIREBASE_API_KEY="$AUREL_FIREBASE_API_KEY"
          --dart-define=AUREL_FIREBASE_APP_ID="$AUREL_FIREBASE_APP_ID"
          --dart-define=AUREL_FIREBASE_PROJECT_ID="$AUREL_FIREBASE_PROJECT_ID"
          --dart-define=AUREL_FIREBASE_MESSAGING_SENDER_ID="$AUREL_FIREBASE_MESSAGING_SENDER_ID"
          --dart-define=AUREL_GOOGLE_SERVER_CLIENT_ID="$AUREL_GOOGLE_SERVER_CLIENT_ID"

      - name: Upload Android debug builds
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: aurel-android-debug-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14
