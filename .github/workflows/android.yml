name: AUREL Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify Flutter app and build APK
    runs-on: ubuntu-latest
    env:
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID != '' && secrets.JAMENDO_CLIENT_ID || '709fa152' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Generate Android project scaffold
        run: |
          flutter create --platforms=android --org com.aurel --project-name aurel .
          mkdir -p android/app/src/main/kotlin/com/aurel/aurel
          cp platform/android/MainActivity.kt android/app/src/main/kotlin/com/aurel/aurel/MainActivity.kt
          cp platform/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -f test/widget_test.dart

      - name: Install Android API 37
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          content = path.read_text()
          content = content.replace(
              'compileSdk = flutter.compileSdkVersion',
              'compileSdk = 35'
          )
          path.write_text(content)
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --dart-define=JAMENDO_CLIENT_ID="$JAMENDO_CLIENT_ID"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AUREL-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
