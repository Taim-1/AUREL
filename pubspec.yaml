name: aurel
description: AUREL — a refined music experience for Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  audio_service: ^0.18.19
  audio_session: ^0.2.2
  dio: ^5.11.1
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  google_sign_in: ^7.2.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: assets/branding/aurel_app_icon.jpg
  adaptive_icon_background: "#080809"
  adaptive_icon_foreground: assets/branding/aurel_app_icon.jpg
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/branding/aurel_app_icon.jpg
